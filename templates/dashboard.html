<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Chain ROC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Option Chain ROC</h1>
            <div class="controls">
                <button id="start-btn" class="btn btn-primary">Start Scraping</button>
                <button id="stop-btn" class="btn btn-danger" disabled>Stop</button>
                <button id="reset-btn" class="btn btn-warning">Reset</button>
            </div>
        </div>

        <!-- Symbol Configuration -->
        <div id="symbol-input-container" class="symbol-input-container">
            <h3>Configure Symbols</h3>
            <p class="date-format-hint">Enter dates in dd/mm/yyyy format (e.g., 30/06/2026)</p>
            <div class="input-row">
                <label>NIFTY Expiry:</label>
                <input type="text" id="nifty-expiry-input" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" value="30/06/2026">
            </div>
            <div class="input-row">
                <label>Equity Symbol (optional):</label>
                <input type="text" id="equity-symbol-input" placeholder="e.g., RELIANCE" maxlength="20">
            </div>
            <div class="input-row">
                <label>Equity Expiry:</label>
                <input type="text" id="equity-expiry-input" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-info">
                <span class="status-label">Status:</span>
                <span id="status-text" class="status-value">Idle</span>
            </div>
            <div class="status-info">
                <span class="status-label">Updates:</span>
                <span id="update-counter" class="status-value">0</span>
            </div>
        </div>

        <!-- OTP Input (hidden by default) -->
        <div id="otp-container" class="otp-container" style="display: none;">
            <div class="otp-box">
                <label for="otp-input">Enter OTP:</label>
                <input type="text" id="otp-input" maxlength="6" pattern="\d{6}" placeholder="6-digit OTP">
                <button id="submit-otp-btn" class="btn btn-primary">Submit OTP</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-container" class="error-container" style="display: none;">
            <div class="error-box">
                <strong>Error:</strong>
                <span id="error-message"></span>
            </div>
        </div>

        <!-- Logs Section -->
        <div class="logs-section">
            <h3>Logs</h3>
            <div id="logs-container" class="logs-box"></div>
        </div>

        <!-- Data Tabs -->
        <div id="tabs-container" class="tabs-container" style="display: none;">
            <div id="tabs-header" class="tabs-header"></div>
            <div id="tabs-content" class="tabs-content"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
